<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Código Escuela 4.0 · IES Santa María del Águila · 2025–2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080c14;--glass:#ffffff08;--glass-border:#ffffff15;
  --text:#e8eef8;--muted:#5a6a8a;
  --IA:#b57bee;--ROB:#00e5a0;--PC:#ffb347;--DIG:#38c8f8;--OTR:#ff6b9d;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}

/* FONDO ANIMADO */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* APP */
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;}

/* HEADER */
.hdr{padding:.9rem 1.5rem .6rem;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--glass-border);flex-shrink:0;}
.logo-title{font-family:'Orbitron',monospace;font-size:clamp(13px,2vw,20px);font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#b57bee,#38c8f8,#00e5a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px;}
.slide-badge{font-family:'Orbitron',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;}

/* PROGRESS */
.prog-wrap{height:2px;background:#ffffff08;flex-shrink:0;}
.prog-bar{height:100%;background:linear-gradient(90deg,#b57bee,#38c8f8,#00e5a0);transition:width .4s ease;width:0%;}

/* SLIDES */
.slides-wrap{flex:1;overflow:hidden;position:relative;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.5rem 2rem 1rem;opacity:0;pointer-events:none;transform:translateY(40px);transition:opacity .5s ease,transform .5s ease;}
.slide.active{opacity:1;pointer-events:all;transform:translateY(0);}

/* PORTADA */
.cover-title{font-family:'Orbitron',monospace;font-size:clamp(20px,4vw,48px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#b57bee,#38c8f8,#00e5a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;line-height:1.2;margin-bottom:.4rem;}
.cover-sub{font-size:clamp(11px,1.3vw,14px);color:var(--muted);letter-spacing:.2em;text-transform:uppercase;text-align:center;margin-bottom:1.5rem;}
.sep{width:min(400px,80%);height:1px;background:linear-gradient(90deg,transparent,#b57bee,#38c8f8,#00e5a0,transparent);margin:0 auto 1.5rem;}
.stats-row{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem;}
.stat{text-align:center;}
.stat-n{font-family:'Orbitron',monospace;font-size:clamp(32px,6vw,60px);font-weight:900;background:linear-gradient(135deg,#b57bee,#38c8f8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:2px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.chip{padding:4px 12px;border-radius:100px;font-size:10px;font-weight:600;border:.5px solid;letter-spacing:.04em;}
.chip.IA{background:#b57bee11;color:var(--IA);border-color:#b57bee44;}
.chip.ROB{background:#00e5a011;color:var(--ROB);border-color:#00e5a044;}
.chip.PC{background:#ffb34711;color:var(--PC);border-color:#ffb34744;}
.chip.DIG{background:#38c8f811;color:var(--DIG);border-color:#38c8f844;}

/* MES */
.month-lbl{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:.3rem;}
.month-name{font-family:'Orbitron',monospace;font-size:clamp(16px,3vw,30px);font-weight:900;color:var(--text);text-align:center;margin-bottom:1.25rem;letter-spacing:1px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;width:100%;max-width:960px;max-height:calc(100vh - 220px);overflow-y:auto;padding-right:4px;}
.cards::-webkit-scrollbar{width:3px;}
.cards::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:2px;}
.card{background:var(--glass);border:.5px solid var(--glass-border);border-radius:14px;padding:1rem;position:relative;overflow:hidden;backdrop-filter:blur(8px);}
.card-top{height:2px;margin-bottom:.65rem;border-radius:2px;}
.card.IA .card-top{background:linear-gradient(90deg,#b57bee,#7c3aed);}
.card.PC .card-top{background:linear-gradient(90deg,#ffb347,#f59e0b);}
.card.DIG .card-top{background:linear-gradient(90deg,#38c8f8,#0ea5e9);}
.card.ROB .card-top{background:linear-gradient(90deg,#00e5a0,#059669);}
.card.OTR .card-top{background:linear-gradient(90deg,#ff6b9d,#db2777);}
.card-icon{font-size:18px;margin-bottom:.3rem;}
.card-badge{display:inline-flex;gap:3px;font-size:9px;font-weight:600;padding:2px 7px;border-radius:100px;margin-bottom:.3rem;border:.5px solid;}
.card-badge.IA{background:#b57bee11;color:var(--IA);border-color:#b57bee33;}
.card-badge.PC{background:#ffb34711;color:var(--PC);border-color:#ffb34733;}
.card-badge.DIG{background:#38c8f811;color:var(--DIG);border-color:#38c8f833;}
.card-badge.ROB{background:#00e5a011;color:var(--ROB);border-color:#00e5a033;}
.card-badge.OTR{background:#ff6b9d11;color:var(--OTR);border-color:#ff6b9d33;}
.card-level{font-size:9px;color:var(--muted);background:#ffffff08;border-radius:100px;padding:1px 6px;display:inline-block;margin-left:3px;margin-bottom:.3rem;}
.card-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:.25rem;}
.card-meta{font-size:10px;color:var(--muted);margin-bottom:.4rem;}
.card-desc{font-size:10px;color:#8899bb;line-height:1.5;margin-bottom:.4rem;}
.card-ev-title{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.2rem;}
.card-ev-item{font-size:9px;color:#8899bb;line-height:1.4;padding-left:.65rem;position:relative;margin-bottom:1px;}
.card-ev-item::before{content:'•';position:absolute;left:0;color:var(--DIG);}
.links-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:.45rem;}
.card-link{font-size:9px;text-decoration:none;display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:100px;border:.5px solid;transition:background .2s;}
.card-link.doc{color:var(--DIG);border-color:#38c8f833;background:#38c8f808;}
.card-link.doc:hover{background:#38c8f820;}
.card-link.video{color:var(--ROB);border-color:#00e5a033;background:#00e5a008;}
.card-link.video:hover{background:#00e5a020;}
.card-link.padlet{color:var(--PC);border-color:#ffb34733;background:#ffb34708;}
.card-link.padlet:hover{background:#ffb34720;}

/* CIERRE */
.close-title{font-family:'Orbitron',monospace;font-size:clamp(18px,3vw,32px);font-weight:900;text-align:center;color:var(--text);margin-bottom:.6rem;}
.close-sub{font-size:clamp(12px,1.3vw,15px);color:var(--muted);text-align:center;max-width:560px;line-height:1.7;margin-bottom:1.5rem;}
.close-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;width:100%;}
.cstat{background:var(--glass);border:.5px solid var(--glass-border);border-radius:14px;padding:1rem;text-align:center;backdrop-filter:blur(8px);}
.cstat-n{font-family:'Orbitron',monospace;font-size:clamp(28px,5vw,48px);font-weight:900;}
.cstat-n.p{color:var(--IA);} .cstat-n.t{color:var(--ROB);} .cstat-n.a{color:var(--PC);} .cstat-n.b{color:var(--DIG);}
.cstat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}

/* NAV */
.nav{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:.75rem 0 .9rem;border-top:.5px solid var(--glass-border);}
.nbtn{width:36px;height:36px;border-radius:50%;background:#ffffff08;border:.5px solid var(--glass-border);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'Inter',sans-serif;}
.nbtn:hover{background:#ffffff14;color:var(--text);}
.nbtn:disabled{opacity:.2;cursor:default;}
@media(max-width:768px){
  .nbtn{width:52px;height:52px;font-size:22px;background:#ffffff12;color:var(--text);}
  .nav{padding:1rem 0 1.2rem;gap:18px;}
  .ndot{width:7px;height:7px;}
  .ndot.on{width:22px;}
  .nctr{font-size:12px;}
  .swipe-hint{display:flex;}
}
.swipe-hint{display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);align-items:center;gap:6px;background:#ffffff08;border:.5px solid var(--glass-border);padding:5px 14px;border-radius:100px;pointer-events:none;animation:fadeHint 3s ease forwards;}
@keyframes fadeHint{0%{opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
.ndots{display:flex;gap:5px;align-items:center;}
.ndot{width:5px;height:5px;border-radius:50%;background:#ffffff18;cursor:pointer;transition:all .25s;}
.ndot.on{background:linear-gradient(135deg,#b57bee,#38c8f8);width:18px;border-radius:3px;}
.nctr{font-family:'Orbitron',monospace;font-size:10px;color:var(--muted);min-width:52px;text-align:center;}
</style>
</head>

const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');
let W,H,parts=[];
const COLS=['#b57bee','#38c8f8','#00e5a0','#ffb347','#ff6b9d'];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
class P{constructor(){this.reset();}reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.25;this.vy=(Math.random()-.5)*.25;this.r=Math.random()*1.4+.4;this.c=COLS[Math.floor(Math.random()*COLS.length)];this.a=Math.random()*.4+.1;}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.reset();}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=this.c+Math.round(this.a*255).toString(16).padStart(2,'0');ctx.fill();}}
for(let i=0;i<60;i++)parts.push(new P());
function drawConn(){for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){const dx=parts[i].x-parts[j].x,dy=parts[i].y-parts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){ctx.beginPath();ctx.moveTo(parts[i].x,parts[i].y);ctx.lineTo(parts[j].x,parts[j].y);ctx.strokeStyle=`rgba(100,140,200,${.06*(1-d/120)})`;ctx.lineWidth=.4;ctx.stroke();}}}
function animate(){ctx.clearRect(0,0,W,H);drawConn();parts.forEach(p=>{p.update();p.draw();});requestAnimationFrame(animate);}
animate();

  {fecha:'2026-02-24',cat:'PC',materia:'Creación Digital y Pensamiento Computacional',profe:'Susana Parlop',nivel:'1º Bachillerato',titulo:'Azulejos de Estilo Andalusí con código Python',desc:'El alumnado diseña bocetos a mano de mosaicos andaluces y los programa en Python, combinando geometría, simetría y color con código.',ev:['Boceto a mano coloreado del azulejo','Código Python con patrón geométrico','Captura del resultado ejecutado','Descripción reflexiva'],url:PADLET,video:null,padlet:true},
  {fecha:'2026-03-01',cat:'IA',materia:'Economía y Emprendimiento',profe:'Segura Rubí / Ruiz Moreno',nivel:'4º ESO',titulo:'Emprender con IA: ¿todo vale? Modelos de negocio éticos',desc:'4º ESO analiza casos reales (Amazon, Netflix) y diseña planes de empresa con IA responsable en formato pitch.',ev:['Plan de Empresa Ético con IA','Presentación del modelo de negocio','Código ético (mín. 5 normas)','Vídeos tipo pitch','Infografías sobre riesgos éticos','Rúbricas y autoevaluaciones'],url:'https://drive.google.com/file/d/1isiijXhnkWP63V7LJWXOiVEqV0k0ZYAZ/view',video:null,padlet:false},
  {fecha:'2026-03-10',cat:'ROB',materia:'Creación Digital y Pensamiento Computacional',profe:'Susana Parlop',nivel:'1º Bachillerato',titulo:'Aula Verde: diseño de espacio exterior con Python y dron',desc:'El alumnado fotografía con dron la zona del aula verde, elabora un boceto, escribe código Python para el plano digital y argumenta su propuesta.',ev:['Fotos aéreas con dron','Boceto a mano del diseño','Código Python del plano','Resultado ejecutado','Argumentación del diseño'],url:PADLET,video:null,padlet:true},
  {fecha:'2026-03-20',cat:'IA',materia:'Biología y Geología',profe:'Sara Vílchez Melguizo',nivel:'4º ESO',titulo:'Póster bibliográfico: mujeres en la genética',desc:'4º ESO visibiliza el papel de mujeres científicas en genética (Rosalind Franklin, Mª Ángela Nieto…) con pósters digitales APA.',ev:['Póster digital con biografía','Referencias APA','Citas de la científica investigada'],url:'https://drive.google.com/file/d/1GwUSxAyo3EOLFkvX1A79ib7Rt-OpLETX/view',video:null,padlet:false},
  {fecha:'2026-03-25',cat:'IA',materia:'Agrojardinería y Composiciones Florales',profe:'María Luz Andrés Bedmar',nivel:'2º CFGB',titulo:'Diseño floral conceptual con IA (estilo Ikebana)',desc:'2º CFGB diseña arreglos florales con principios de floristería y usa ChatGPT para generar imágenes fotorrealistas.',ev:['Boceto a mano alzada','Informe con justificación de materiales','Imagen fotorrealista con ChatGPT'],url:'https://drive.google.com/file/d/1rWAeMmPFsH5EK0l5J53kSqG6O8OWKp0h/view',video:null,padlet:false},
  {fecha:'2026-04-21',cat:'PC',materia:'Creación Digital y Pensamiento Computacional',profe:'Susana Parlop',nivel:'1º Bachillerato',titulo:'Arte Generativo Alborán: naturaleza almeriense con código',desc:'El alumnado crea obras de arte generativo inspiradas en elementos naturales almerienses: espirales de girasol, campos desde arriba, flores del Cabo de Gata. Todo con Python.',ev:['Imagen generativa con código Python','Descripción del elemento natural inspirador','Reflexión sobre el proceso creativo-computacional'],url:PADLET,video:null,padlet:true},
];

acts.sort((a,b)=>a.fecha.localeCompare(b.fecha));
const months={};
acts.forEach(a=>{const[y,m]=a.fecha.split('-');const k=`${y}-${m}`;if(!months[k])months[k]=[];months[k].push(a);});
const sortedKeys=Object.keys(months).sort();

const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
let slides=[];let cur=0;

function mkSlide(html,label=''){
  const d=document.createElement('div');
  d.className='slide';
  d.dataset.label=label;
  d.innerHTML=html;
  wrap.appendChild(d);
  slides.push(d);
}

function animCount(el,target){let n=0;const step=Math.max(1,Math.ceil(target/25));const iv=setInterval(()=>{n=Math.min(n+step,target);el.textContent=n;if(n>=target)clearInterval(iv);},40);}

function renderCard(a){
  return `<div class="card ${a.cat}">
    <div class="card-top"></div>
    <div class="card-icon">${catIcon[a.cat]}</div>
    <span class="card-badge ${a.cat}">${catLabel[a.cat]}</span><span class="card-level">${a.nivel}</span>
    <div class="card-title">${a.titulo}</div>
    <div class="card-meta">${a.materia} · ${a.profe.split('/')[0].trim()}</div>
    <div class="card-desc">${a.desc}</div>
    <div class="card-ev-title">Evidencias</div>
    ${a.ev.map(e=>`<div class="card-ev-item">${e}</div>`).join('')}
    <div class="links-row">
      ${a.padlet?`<a class="card-link padlet" href="${a.url}" target="_blank">📌 Ver creaciones</a>`:`<a class="card-link doc" href="${a.url}" target="_blank">📄 Ver actividad</a>`}
      ${a.video?`<a class="card-link video" href="${a.video}" target="_blank">▶ Ver vídeo</a>`:''}
    </div>
  </div>`;
}

// PORTADA
const profes=new Set(acts.map(a=>a.profe.split('/')[0].trim())).size;
const materias=new Set(acts.map(a=>a.materia)).size;
const niveles=new Set(acts.map(a=>a.nivel)).size;
mkSlide(`
  <div class="cover-title">CÓDIGO ESCUELA 4.0</div>
  <div class="cover-sub">IES Santa María del Águila · Curso 2025–2026</div>
  <div class="sep"></div>
  <div class="stats-row">
    <div class="stat"><div class="stat-n" id="cn1">0</div><div class="stat-l">Actividades</div></div>
    <div class="stat"><div class="stat-n" id="cn2">0</div><div class="stat-l">Docentes</div></div>
    <div class="stat"><div class="stat-n" id="cn3">0</div><div class="stat-l">Materias</div></div>
    <div class="stat"><div class="stat-n" id="cn4">0</div><div class="stat-l">Niveles</div></div>
  </div>
  <div class="chips">
    <span class="chip IA">🤖 IA y uso ético</span>
    <span class="chip ROB">⚙️ Computación y robótica</span>
    <span class="chip PC">💡 Pensamiento computacional</span>
    <span class="chip DIG">🌐 Competencia digital</span>
  </div>
`,'Portada');

// SLIDES POR MES
sortedKeys.forEach(k=>{
  const[y,m]=k.split('-');
  const label=`${MN[m]||m} ${y}`;
  mkSlide(`
    <div class="month-lbl">Actividades de</div>
    <div class="month-name">${label.toUpperCase()}</div>
    <div class="cards">${months[k].map(renderCard).join('')}</div>
  `,label);
});

// CIERRE
mkSlide(`
  <div class="close-title">Un curso de innovación educativa</div>
  <div class="close-sub">El IES Santa María del Águila ha integrado IA, robótica, pensamiento computacional y competencia digital en múltiples materias y niveles, demostrando que el Código Escuela 4.0 es transversal y transformador.</div>
  <div class="close-grid">
    <div class="cstat"><div class="cstat-n p">${acts.length}</div><div class="cstat-l">Actividades</div></div>
    <div class="cstat"><div class="cstat-n t">${profes}</div><div class="cstat-l">Docentes</div></div>
    <div class="cstat"><div class="cstat-n a">${materias}</div><div class="cstat-l">Materias</div></div>
    <div class="cstat"><div class="cstat-n b">${niveles}</div><div class="cstat-l">Niveles educativos</div></div>
  </div>
`,'Cierre');

// DOTS
slides.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='ndot'+(i===0?' on':'');
  d.onclick=()=>goTo(i);
  dotsEl.appendChild(d);
});

function goTo(n){
  slides[cur].classList.remove('active');
  document.querySelectorAll('.ndot')[cur].classList.remove('on');
  cur=n;
  slides[cur].classList.add('active');
  document.querySelectorAll('.ndot')[cur].classList.add('on');
  const pct=cur===0?0:(cur/(slides.length-1)*100);
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('ctr').textContent=`${cur+1} / ${slides.length}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===slides.length-1;
  const lbl=slides[cur].dataset.label;
  document.getElementById('slide-badge').textContent=(lbl==='Portada'||lbl==='Cierre')?'':lbl.toUpperCase();
}
function go(d){if(cur+d>=0&&cur+d<slides.length)goTo(cur+d);}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' ')go(1);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft')go(-1);
});

/* TOUCH SWIPE */
let tStartX=0,tStartY=0;
document.addEventListener('touchstart',e=>{tStartX=e.touches[0].clientX;tStartY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tStartX;
  const dy=e.changedTouches[0].clientY-tStartY;
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>40){
    if(dy<0)go(1); else go(-1);
    const hint=document.getElementById('swipe-hint');
    if(hint)hint.style.display='none';
  }
},{passive:true});

/* Mostrar hint swipe solo en móvil la primera vez */
if(window.innerWidth<=768){
  const hint=document.getElementById('swipe-hint');
  if(hint){hint.style.display='flex';setTimeout(()=>{hint.style.display='none';},3500);}
}

goTo(0);
setTimeout(()=>{
  animCount(document.getElementById('cn1'),acts.length);
  animCount(document.getElementById('cn2'),profes);
  animCount(document.getElementById('cn3'),materias);
  animCount(document.getElementById('cn4'),niveles);
},300);
</script>
</body>
</html>
